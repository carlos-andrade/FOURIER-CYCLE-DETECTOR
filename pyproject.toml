[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-gyroscope"
version = "0.3.0"
description = "Causal harmonic market-state research engine for WINFUT 60K Trades bars"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "ruff>=0.6", "mypy>=1.11"]
analysis = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
