[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-gyroscope"
version = "0.1.0"
description = "Causal harmonic market-state research engine for WINFUT Renko data"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.6",
  "mypy>=1.11"
]
visualization = [
  "matplotlib>=3.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
