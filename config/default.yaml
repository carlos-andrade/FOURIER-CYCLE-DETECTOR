project:
  name: FOURIER-CYCLE-DETECTOR
  engine: FOURIER-GYROSCOPE
  status: research

market:
  instrument: WINFUT
  source_platform: Profit One
  chart_type: trades
  chart_label: 60K Trades
  target_trade_count_per_bar: 60000
  update_policy: closed_bar_only

analysis:
  windows: [128, 256]
  window_function: hann
  min_frequency_cycles_per_bar: 0.015625
  max_frequency_cycles_per_bar: 0.25
  reconstruction_harmonics: 3

safety:
  allow_order_execution: false
  allow_brickmaster_integration: false
  require_causal_processing: true
  preserve_emitted_signals: true
